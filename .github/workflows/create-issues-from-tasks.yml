name: 📋 Sync TASKS.md → GitHub Issues

on:
  push:
    branches: [master]
    paths: [TASKS.md]
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync-issues:
    name: Sync Issues from TASKS.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: TASKS.md
          sparse-checkout-cone-mode: false

      - name: Parse and create/update issues
        id: sync
        run: |
          # ============================================================
          # Закрытые (done) задачи
          # ============================================================
          
          # --- Инфраструктура ---
          gh issue edit 2 --add-label "done" --add-label "infrastructure" --unlock 2>/dev/null || \
          gh issue create \
            --title "🏗️ Инфраструктура" \
            --body "## ✅ Готово

- [x] VPS Beget: \`root@159.194.226.89\`, приложение на \`/opt/seo-monitor/\`
- [x] Docker: FastAPI + APScheduler + PostgreSQL 16
- [x] Домен: https://seo.albion1.ru/ (HTTPS, Caddy, Let's Encrypt)
- [x] GitHub: https://github.com/gvingm/seo-monitor
- [x] Ежедневный cron в 08:30 MSK (APScheduler)

**Deploy:** \`deploy_v5.py\` → SSH → Beget" \
            --label "done" \
            --label "infrastructure" \
            --milestone "v1.0-done" \
            --state "closed" 2>/dev/null || true

          # --- SEO monitoring ---
          gh issue create \
            --title "🔍 SEO-мониторинг" \
            --body "## ✅ Готово

- [x] Яндекс Cloud Search API v2: 134 ключевых слова × 2 региона
- [x] Яндекс Вебмастер API v4: query-analytics
- [x] 7 тематических кластеров с WoW-дельтой
- [x] 50 алертов (позиции выпали из ТОП-20)
- [x] 10 SEO-рекомендаций для didalsk.ru
- [x] API endpoints: \`/health\`, \`/api/clusters\`, \`/api/alerts\`, \`/api/recommendations\`, \`/api/report.md\`

**Кластеры (08.09.2026):**
| Кластер | Поз. | WoW | Тренд |
|---------|-------|-----|-------|
| Дноуглубление | 6.83 | -14.6% | 🟢 растёт |
| Аренда техники | 4.85 | -21.9% | 🟢 растёт |
| Маломерный флот | 6.94 | -4.7% | 🟢 растёт |
| Гидротехнические | 8.19 | +2.6% | 🔴 падает |
| Протаскивание дюкеров | 14.5 | +21.3% | 🔴 падает |
| Берегоукрепление | — | нет данных | ⚪ пусто |" \
            --label "done" \
            --label "seo" \
            --state "closed" 2>/dev/null || true

          # ============================================================
          # В работе
          # ============================================================

          # --- GSC ---
          gh issue create \
            --title "🔴 GSC: интеграция Google Search Console" \
            --body "## 🚧 В работе — ждёт credentials

**Что нужно от пользователя:**

1. **Google Cloud Console** → создать Service Account
2. **Service Account** → добавить в property \`https://didalsk.ru/\` (SHARE → добавить пользователя)
3. **Download JSON** → положить файл на сервер: \`/app/creds/gsc.json\`
4. **`.env`** → добавить:
\`\`\`
GOOGLE_APPLICATION_CREDENTIALS=/app/creds/gsc.json
\`\`\`
5. **Deploy:** \`python deploy_v5.py\`

**Что даст:** данные GSC (показы, клики, CTR) + позиции Google отдельно от Яндекса

**Status: waiting-for-user**" \
            --label "enhancement" \
            --label "gsc" \
            --label "waiting-for-user" 2>/dev/null || echo "GSC issue exists"

          # --- Telegram ---
          gh issue create \
            --title "🔴 Telegram: уведомления и daily digest" \
            --body "## 🚧 В работе — ждёт credentials

**Что нужно от пользователя:**

1. **@BotFather** → \`/newbot\` → получить bot token
2. **@userinfobot** или \`@getidsbot\` → получить chat_id
3. **`.env`** → добавить:
\`\`\`
TELEGRAM_BOT_TOKEN=123456:ABC-DEF...
TELEGRAM_CHAT_ID=123456789
\`\`\`
4. **Deploy:** \`python deploy_v5.py\`

**Формат digest (08:30 MSK):**
- 🟢/🔴 топ movers за неделю
- Количество алертов
- Средняя позиция по кластерам
- Ссылка на дашборд

**Status: waiting-for-user**" \
            --label "enhancement" \
            --label "telegram" \
            --label "waiting-for-user" 2>/dev/null || echo "Telegram issue exists"

          # ============================================================
          # Не начато
          # ============================================================

          # --- Берегоукрепление ---
          gh issue create \
            --title "🟡 Берегоукрепление: 16 ключей без данных" \
            --body "## ⬜ Не начато

**Проблема:** кластер «Берегоукрепление» — 16 keywords, 0 позиций в БД (нет проектов в портфолио)

**Варианты:**
1. Добавить реальный проект/услугу → позиции появятся автоматически
2. Снять кластер с мониторинга (убрать ключи из keywords)
3. Добавить информационную страницу

**Влияние:** чем больше страниц в портфолио — тем больше позиций → тем точнее мониторинг

**Также ухудшаются:**
- Дюкеры: +21.3% (хуже)
- Гидротехнические: +2.6% (хуже)

**Action:** → создать 1-2 страницы/кейса по берегоукреплению" \
            --label "content" \
            --label "shore-cluster" \
            --label "priority-medium" 2>/dev/null || echo "Shore issue exists"

          # --- Lark ---
          gh issue create \
            --title "🟡 Lark Bitable: дашборд" \
            --body "## ⬜ Не начато

**Опционально** — веб-интерфейс seo.albion1.ru работает.

**Для Lark-дашборда:**
1. Lark App ID + Secret
2. Scopes: \`base:app:create\`, \`docx:app:create\`
3. Подключение в config.json

**Что делать:** пока веб-интерфейс покрывает все needs → оставить на потом" \
            --label "enhancement" \
            --label "lark" \
            --label "low-priority" 2>/dev/null || echo "Lark issue exists"

          # --- WP File Manager ---
          gh issue create \
            --title "🔴 Безопасность: WP File Manager Pro" \
            --body "## 🚧 Требует внимания

**Проблема:** WP File Manager Pro на didalsk.ru — критический security risk (известные RCE-уязвимости)

**Действие:**
1. WP Admin → Plugins → **удалить** WP File Manager Pro
2. Для редактирования файлов → использовать SFTP/SSH напрямую

**Risk:** если хакер получит доступ → полный захват сайта

**Status: needs-action**" \
            --label "security" \
            --label "didalsk" \
            --label "priority-high" \
            --label "needs-action" 2>/dev/null || echo "WP issue exists"

          echo "✅ Issues synced from TASKS.md"
          echo ""
          echo "To create a Project board manually:"
          echo "1. https://github.com/gvingm/seo-monitor/projects → New project"
          echo "2. Add → Import from columns → select the issue labels above"
