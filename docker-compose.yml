# docker-compose.yml — локальная разработка и production на Beget VPS
# Usage:
#   Local:  docker-compose up --build
#   Beget:  docker-compose -f docker-compose.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-monitor-app
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file:
      - .env
    volumes:
      - ./creds:/app/creds:ro
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/python3.11", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8788/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: seo-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: seomonitor
      POSTGRES_USER: seomonitor
      POSTGRES_PASSWORD: ChangeMe123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seomonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
